x-atlas-api-image: &atlas-api-image
  image: ${ATLAS_OFFLINE_IMAGE_PREFIX:?set offline image prefix}/api:${ATLAS_OFFLINE_VERSION:?set offline version}-${ATLAS_OFFLINE_PLATFORM_TAG:?set offline platform tag}
  platform: ${ATLAS_OFFLINE_PLATFORM:?set offline target platform}

x-atlas-embedding-model-image: &atlas-embedding-model-image
  image: ${ATLAS_OFFLINE_IMAGE_PREFIX:?set offline image prefix}/embedding-model:e052ba4b733767ddea9fd3e6640ff41a0a83599baea0b0eadd97189d92f2d396-${ATLAS_OFFLINE_PLATFORM_TAG:?set offline platform tag}
  platform: ${ATLAS_OFFLINE_PLATFORM:?set offline target platform}

services:
  deployment-secret-init:
    <<: *atlas-api-image

  artifact-storage-init:
    <<: *atlas-api-image

  celery-dispatch:
    <<: *atlas-api-image

  celery-maintenance:
    <<: *atlas-api-image

  celery-beat:
    <<: *atlas-api-image

  notes-collaboration:
    image: ${ATLAS_OFFLINE_IMAGE_PREFIX:?set offline image prefix}/notes-collaboration:${ATLAS_OFFLINE_VERSION:?set offline version}-${ATLAS_OFFLINE_PLATFORM_TAG:?set offline platform tag}
    platform: ${ATLAS_OFFLINE_PLATFORM:?set offline target platform}

  plugin-runner:
    image: ${ATLAS_OFFLINE_IMAGE_PREFIX:?set offline image prefix}/plugin-runner:${ATLAS_OFFLINE_VERSION:?set offline version}-${ATLAS_OFFLINE_PLATFORM_TAG:?set offline platform tag}
    platform: ${ATLAS_OFFLINE_PLATFORM:?set offline target platform}

  office-renderer:
    image: ${ATLAS_OFFLINE_IMAGE_PREFIX:?set offline image prefix}/office-renderer:${ATLAS_OFFLINE_VERSION:?set offline version}-${ATLAS_OFFLINE_PLATFORM_TAG:?set offline platform tag}
    platform: ${ATLAS_OFFLINE_PLATFORM:?set offline target platform}

  web:
    image: ${ATLAS_OFFLINE_IMAGE_PREFIX:?set offline image prefix}/web:${ATLAS_OFFLINE_VERSION:?set offline version}-${ATLAS_OFFLINE_PLATFORM_TAG:?set offline platform tag}
    platform: ${ATLAS_OFFLINE_PLATFORM:?set offline target platform}

  postgres:
    image: ${ATLAS_OFFLINE_IMAGE_PREFIX:?set offline image prefix}/postgres:${ATLAS_OFFLINE_VERSION:?set offline version}-${ATLAS_OFFLINE_PLATFORM_TAG:?set offline platform tag}
    platform: ${ATLAS_OFFLINE_PLATFORM:?set offline target platform}

  redis:
    image: ${ATLAS_OFFLINE_IMAGE_PREFIX:?set offline image prefix}/redis:${ATLAS_OFFLINE_VERSION:?set offline version}-${ATLAS_OFFLINE_PLATFORM_TAG:?set offline platform tag}
    platform: ${ATLAS_OFFLINE_PLATFORM:?set offline target platform}

  qdrant:
    image: ${ATLAS_OFFLINE_IMAGE_PREFIX:?set offline image prefix}/qdrant:${ATLAS_OFFLINE_VERSION:?set offline version}-${ATLAS_OFFLINE_PLATFORM_TAG:?set offline platform tag}
    platform: ${ATLAS_OFFLINE_PLATFORM:?set offline target platform}

  embedding-model-init:
    <<: *atlas-embedding-model-image

  api:
    <<: *atlas-api-image
    environment:
      ATLAS_EMBEDDING_OFFLINE: "true"
      HF_HUB_OFFLINE: "1"
      TIKTOKEN_CACHE_DIR: /var/lib/atlas-tiktoken
    depends_on:
      embedding-model-init:
        condition: service_completed_successfully

  celery-processing:
    <<: *atlas-api-image
    environment:
      ATLAS_EMBEDDING_OFFLINE: "true"
      HF_HUB_OFFLINE: "1"
      TIKTOKEN_CACHE_DIR: /var/lib/atlas-tiktoken
    depends_on:
      embedding-model-init:
        condition: service_completed_successfully

  celery-indexing:
    <<: *atlas-api-image
    environment:
      ATLAS_EMBEDDING_OFFLINE: "true"
      HF_HUB_OFFLINE: "1"
      TIKTOKEN_CACHE_DIR: /var/lib/atlas-tiktoken
    depends_on:
      embedding-model-init:
        condition: service_completed_successfully
