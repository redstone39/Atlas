[project]
name = "atlas-office-renderer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "pillow==12.3.0",
  "pypdf==6.0.0",
  "pypdfium2==5.11.0",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
